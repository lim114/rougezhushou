[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rouge-blackflow-helper"
version = "0.70.0"
description = "Windows blackflow exploration and damage test application"
requires-python = ">=3.12"
dependencies = ["mistune==3.4.0", "pynput==1.8.1; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["rouge*", "third_party.qframelesswindow*"]

[tool.setuptools.package-data]
rouge = ["data/*.json","data/*.txt","data/ui-icons/*.png","data/relic-icons/*.png","data/run-badges/*.webp","data/battle-maps/*.png","data/portraits/*.png","data/skill-icons/*.png","data/profession-icons/*.png","data/page-features/*.json","data/page-features/*.npz","data/page-features/*.png","data/visual-anchors/*.json","data/visual-anchors/*.png","data/player-theme/*.qss","data/player-theme/*.json","data/player-theme/*.txt","data/player-theme/icons/*.svg"]
"rouge.bridge" = ["*.cjs"]

"third_party.qframelesswindow" = ["LICENSE", "COPYING", "NOTICE.md", "_rc/*.qrc", "_rc/title_bar/*.svg"]
