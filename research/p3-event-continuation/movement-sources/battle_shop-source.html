<ul><li><i>商店</i> <span style="color:#0c493d;">诡意行商</span> <p id="诡意行商" style="margin:0;padding:0;"></p></li></ul>
<dl><dd><i>不是盟友也不是敌人，有些人喜欢站在中间。</i></dd>
<dd>可以消耗源石锭购买道具（包括招募券和战术道具）、收藏品和零件的<i>坎诺特</i>的商店。</dd>
<dd>相较于往期主题，于第1层出现的商店出现的职业招募券不再仅限先锋/术师/医疗三种。</dd>
<dd><b>在点亮【生命游戏】的“脊髓”节点后，每个诡意行商节点均可消耗源石锭用于刷新商店库存。</b>
<ul><li>初始消耗4源石锭，每次刷新库存消耗的源石锭+4，每个节点最多刷新4次。</li></ul></dd>
<dd>在点亮【生命游戏】的“额叶”节点后，还可以出售不再需要的零件。</dd>
