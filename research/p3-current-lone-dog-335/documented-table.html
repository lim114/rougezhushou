<h3 id="独活">独活</h3>
<table class="wikitable" style="width:100%">
<tbody><tr>
<td colspan="3"><div class="center"><div class="floatnone"><img alt="Pic rogue 6 21.png" src="https://patchwiki.biligame.com/images/arknights/thumb/c/c7/82gzdeeo66qq3dpbq4sbayovcidj8ds.png/600px-Pic_rogue_6_21.png" decoding="async" loading="lazy" width="600" height="338" srcset="https://patchwiki.biligame.com/images/arknights/thumb/c/c7/82gzdeeo66qq3dpbq4sbayovcidj8ds.png/900px-Pic_rogue_6_21.png 1.5x, https://patchwiki.biligame.com/images/arknights/thumb/c/c7/82gzdeeo66qq3dpbq4sbayovcidj8ds.png/1200px-Pic_rogue_6_21.png 2x" data-file-width="1600" data-file-height="900" /></div></div>
</td></tr>
<tr>
<th colspan="3">夜晚已经降临。不远处出现了一只裹着披风的安静小狗，它动了动耳朵，抬头望向挂满佣兵识别牌的巨大树木。
</th></tr>
<tr>
<td rowspan="4">主选项
</td>
<td rowspan="2">选项一
</td>
<td><b>去看看小狗</b><br />获得收藏品<span style="color:#38d0d4">同行者</span>
</td></tr>
<tr>
<th colspan="2">你找到了它，礼貌地询问它附近是否有可以歇脚的营地。它没有说话也没有看你，你们眼前的丛林一片漆黑，树梢上失去主人的识别牌摇摇晃晃。看起来它已经独自行动很久了。
</th></tr>
<tr>
<td rowspan="2">选项二
</td>
<td><b>小心为上</b><br />多一事不如少一事
</td></tr>
<tr>
<th colspan="2">你没有跟上去，小狗停下来看了看你，似乎在它眼中你与树梢上的识别牌没有什么不同。它抖抖耳朵便离开了。
</th></tr>
<tr>
<td rowspan="2">选项一分支
</td>
<td>分支1.1
</td>
<td><b>跟随小狗</b><br />前往应急助力
</td></tr>
<tr>
<td>分支1.2
</td>
<td><b>请小狗告知营地位置</b><br />标记应急助力位置
</td></tr></tbody></table>
