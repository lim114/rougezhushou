<div class="AKCollapse-title" style=""><span class="mdi mdi-ticket-account" style="font-size:;color:;"></span> 招募券留存</div>
<div class="AKCollapse-content">
<p>除初始招募外，玩家获得招募券时，若暂时不想即时招募，可点击画面右上角的按钮“留存招募券”。
</p><p>在<span style="color:#90ac34;"><b>【险路尽头】</b></span>或<span style="color:#00a1e9;"><b>【安全的角落】</b></span>（点亮【生命游戏】的“血管”节点后）可以将留存的招募券取出招募。
</p><p>※注意：留存券数初始上限3张，将招募卷取出时不可再次存入。
</p><p>※注意：对于招募券包含的随机效果（如随机直升、随机获取干员、临时招募出现状态等），在取出时会重新进行随机判定。
</p><p>※注意：留存达到上限时，无法继续留存；留存时，亦无法选择替换已留存的券。
</p>
</div>
